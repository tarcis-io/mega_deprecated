[package]
name        = "mega"
version     = "0.0.1"
edition     = "2024"
authors     = ["Tarcisio Oliveira <t@rcis.io>"]
description = "The hallucinator machine."
publish     = false

[lib]
crate-type = [
    # Produces the WASM binary for the browser.
    "cdylib",

    # Allows the server binary and tests to link against the same code.
    "rlib",
]

[dependencies]
# Core framework utilities compiled into both the server binary and WASM client.
leptos        = { version = "0.8.19"  }
leptos_i18n   = { version = "0.6.2"   }
leptos_meta   = { version = "0.8.6"   }
leptos_router = { version = "0.8.13"  }
serde         = { version = "1.0.228", features = ["derive"] }
serde_json    = { version = "1.0.150" }
strum         = { version = "0.28.0"  }
tracing       = { version = "0.1.44"  }
thiserror     = { version = "2.0.18"  }
